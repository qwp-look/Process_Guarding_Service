<h3>Script Runner</h3>
<p>Restricted local script runner. Default is disabled; scripts must resolve under the module data scripts directory, are pinned by SHA-256 at registration, and run with confirm=1.</p>
<pre>op=status
op=config;enabled=1
op=add;id=job;path_b64=...;args_b64=...
op=run;id=job;confirm=1</pre>
