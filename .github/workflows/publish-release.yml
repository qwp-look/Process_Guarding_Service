name: publish-release

on:
  push:
    branches:
      - release/**
      - codex/roadmap-sched-remote-cluster
    tags:
      - 'Personal_Version_V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create or update when dispatching from a branch.
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: windows-2025
    env:
      REQUESTED_TAG_NAME: ${{ github.event.inputs.tag_name }}
      PGS_VERSION_FILE: VERSION
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      # Cache only the compile-critical parts of the installed MinGW64
      # toolchain plus CMake/Qt runtime metadata. CMake itself needs
      # share/cmake modules at runtime; Qt CMake targets also reference
      # share/qt6 plugin/metatype files, so cache hits must restore both.
      - name: Cache MinGW64 toolchain
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\mingw64\bin
            C:\msys64\mingw64\lib
            C:\msys64\mingw64\include
            C:\msys64\mingw64\x86_64-w64-mingw32
            C:\msys64\mingw64\share\cmake
            C:\msys64\mingw64\share\qt6
          key: msys2-mingw64-installed-${{ runner.os }}-v5

      - name: Install MinGW64 toolchain
        shell: pwsh
        run: |
          $needsInstall = '${{ steps.mingw-cache.outputs.cache-hit }}' -ne 'true'
          if (-not $needsInstall) {
            & 'C:\msys64\mingw64\bin\cmake.exe' --version
            if ($LASTEXITCODE -ne 0) { $needsInstall = $true }
          }
          if (-not (Test-Path 'C:\msys64\mingw64\share\cmake\Modules\CMake.cmake')) { $needsInstall = $true }
          if (-not (Test-Path 'C:\msys64\mingw64\share\qt6')) { $needsInstall = $true }
          if (-not $needsInstall) {
            'MinGW64 toolchain cache is complete.'
            return
          }
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-httpserver mingw-w64-x86_64-qt6-websockets mingw-w64-x86_64-qt6-tools'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $isccDisplay = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $isccBatchPath = 'C:\Progra~2\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $isccDisplay)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $isccDisplay)) {
            throw "Inno Setup compiler not found at $isccDisplay"
          }
          "ISCC=$isccBatchPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare clean build outputs
        shell: pwsh
        run: |
          foreach ($path in @('build', 'release', 'installer\Output')) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Force -Path 'build\tmp', 'build\home' | Out-Null

      - name: Verify current ref from source
        shell: pwsh
        run: |
          .\tools\verify.bat

      - name: Build release artifacts from current ref
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath $env:PGS_VERSION_FILE -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty' }
          "PGS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NAME=ProcessGuard Service $version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER=installer/Output/pgs_setup_$version.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ZIP=installer/Output/pgs_release_$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHA256SUMS=installer/Output/SHA256SUMS.txt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_MANIFEST=installer/Output/release-manifest.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SBOM=installer/Output/sbom.spdx.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_TAG_NAME)) {
            "DEFAULT_TAG_NAME=Personal_Version_V$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "DEFAULT_TAG_NAME=$env:REQUESTED_TAG_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          .\tools\build_installer.bat

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installer/Output/pgs_setup_*.exe
            installer/Output/pgs_release_*.zip
            installer/Output/SHA256SUMS.txt
            installer/Output/release-manifest.json
            installer/Output/sbom.spdx.json

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:REQUESTED_TAG_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $env:DEFAULT_TAG_NAME
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'pgs-release-publisher'
          }

          $uploadAssets = @(
            [pscustomobject]@{ Path = $env:INSTALLER; ContentType = 'application/octet-stream' }
            [pscustomobject]@{ Path = $env:RELEASE_ZIP; ContentType = 'application/zip' }
            [pscustomobject]@{ Path = $env:SHA256SUMS; ContentType = 'text/plain' }
            [pscustomobject]@{ Path = $env:RELEASE_MANIFEST; ContentType = 'application/json' }
            [pscustomobject]@{ Path = $env:SBOM; ContentType = 'application/json' }
          )

          foreach ($asset in $uploadAssets) {
            if (-not (Test-Path -LiteralPath $asset.Path)) {
              throw "Release asset missing: $($asset.Path)"
            }
          }

          $installerHash = (Get-FileHash -LiteralPath $env:INSTALLER -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -LiteralPath $env:RELEASE_ZIP -Algorithm SHA256).Hash
          $checksumsHash = (Get-FileHash -LiteralPath $env:SHA256SUMS -Algorithm SHA256).Hash
          $manifestHash = (Get-FileHash -LiteralPath $env:RELEASE_MANIFEST -Algorithm SHA256).Hash
          $sbomHash = (Get-FileHash -LiteralPath $env:SBOM -Algorithm SHA256).Hash
          $body = @"
          ProcessGuard Service $env:PGS_VERSION release.

          Source ref:
          - $env:GITHUB_REF_NAME ($env:GITHUB_SHA)

          Assets:
          - $([IO.Path]::GetFileName($env:INSTALLER)) - installer, SHA256 $installerHash
          - $([IO.Path]::GetFileName($env:RELEASE_ZIP)) - portable release tree, SHA256 $zipHash
          - $([IO.Path]::GetFileName($env:SHA256SUMS)) - release asset checksums, SHA256 $checksumsHash
          - $([IO.Path]::GetFileName($env:RELEASE_MANIFEST)) - file/module manifest, SHA256 $manifestHash
          - $([IO.Path]::GetFileName($env:SBOM)) - SPDX SBOM, SHA256 $sbomHash

          Supply-chain metadata:
          - release-manifest.json records release tree files, hashes, source commit, toolchain versions, and modules.lock.
          - sbom.spdx.json is generated from the exact release tree.
          - GitHub Actions artifact attestation is generated for the installer, portable zip, checksum file, release manifest, and SBOM.

          Includes:
          - hardened admin web remote mode with TLS/RBAC/audit/CSRF gates
          - hardened cluster dashboard with API token, HTTPS, node TLS verification, and safe registry handling
          - lightweight Qt TCP HTTP shim for Windows VM response reliability
          - refreshed self-contained release tree with Qt/OpenSSL runtime closure
          - bundled metrics, backup, eventlog, and Windows-native notify modules
          - Inno Setup installer plus portable zip

          Validation completed by this workflow:
          - tools\verify.bat from the checked-out ref
          - tools\build_installer.bat, which rebuilds release\ and installer\Output from the checked-out ref
          - release manifest, SBOM, SHA256SUMS, and artifact attestation generation from CI outputs
          "@

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get `
              -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" `
              -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) {
              throw
            }
          }

          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = $env:RELEASE_NAME
              body = $body
              draft = $false
              prerelease = $false
            } | ConvertTo-Json -Depth 5

            $release = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/$repo/releases" `
              -Headers $headers `
              -Body $payload `
              -ContentType 'application/json'
          } else {
            $payload = @{
              name = $env:RELEASE_NAME
              body = $body
              draft = $false
              prerelease = $false
            } | ConvertTo-Json -Depth 5

            $release = Invoke-RestMethod -Method Patch `
              -Uri "https://api.github.com/repos/$repo/releases/$($release.id)" `
              -Headers $headers `
              -Body $payload `
              -ContentType 'application/json'
          }

          $assets = Invoke-RestMethod -Method Get `
            -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets" `
            -Headers $headers

          $assetNames = $uploadAssets | ForEach-Object { [IO.Path]::GetFileName($_.Path) }
          foreach ($asset in $assets) {
            if ($asset.name -in $assetNames) {
              Invoke-RestMethod -Method Delete -Uri $asset.url -Headers $headers | Out-Null
            }
          }

          function Upload-Asset([string] $Path, [string] $ContentType) {
            $name = [IO.Path]::GetFileName($Path)
            $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
            $uri = "${uploadUrl}?name=$([uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post `
              -Uri $uri `
              -Headers $headers `
              -InFile $Path `
              -ContentType $ContentType | Out-Null
          }

          foreach ($asset in $uploadAssets) {
            Upload-Asset $asset.Path $asset.ContentType
          }

          "Published $($release.html_url)"
