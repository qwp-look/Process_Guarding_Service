name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # Cache the INSTALLED MinGW64 toolchain (C:\msys64\mingw64), not just the
      # pacman package files. The windows-2025 image preinstalls MSYS2 itself
      # but NOT the mingw-w64 toolchain, so without this every run spends ~75s
      # letting pacman sync databases + verify signatures + unpack ~40 packages
      # into a clean image. Caching the installed tree lets us skip pacman
      # entirely on hit: g++.exe/cmake/make are already in place.
      - name: Cache MinGW64 toolchain
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: C:\msys64\mingw64
          key: msys2-mingw64-installed-${{ runner.os }}-v1

      - name: Install MinGW64 toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          # Use GITHUB_WORKSPACE (always set by the Actions runtime) instead of
          # $PWD, which is empty when pwsh spawns bash and caused
          # "cd /d//home/runneradmin: No such file".
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/build_pgs.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/smoke_test_pgs.sh'