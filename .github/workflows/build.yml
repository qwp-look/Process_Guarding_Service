name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # Cache only the compile-critical parts of the installed MinGW64
      # toolchain plus Qt's runtime metadata. Qt CMake targets reference
      # share/qt6 plugin/metatype files, so cache hits must restore it too.
      - name: Cache MinGW64 toolchain
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\mingw64\bin
            C:\msys64\mingw64\lib
            C:\msys64\mingw64\include
            C:\msys64\mingw64\x86_64-w64-mingw32
            C:\msys64\mingw64\share\qt6
          key: msys2-mingw64-installed-${{ runner.os }}-v4

      - name: Install MinGW64 toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-httpserver mingw-w64-x86_64-qt6-websockets mingw-w64-x86_64-qt6-tools'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp && export TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/build_pgs.sh'

      - name: Run core unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp && export TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/test_core_units.sh'

      - name: Run scheduler cron unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp && export TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/test_sched_cron.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp && export TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/smoke_test_pgs.sh'

      - name: Build Qt web consoles
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp && export TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/build_qt_web.sh'
