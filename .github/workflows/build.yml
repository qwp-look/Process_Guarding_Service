name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Install MSYS2
        shell: pwsh
        run: |
          $msysPath = 'C:\msys64'
          if (-not (Test-Path $msysPath)) {
            & choco install msys2 --yes --no-progress
          }
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd /d/$(cygpath -u "$PWD") && ./tools/build_pgs.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd /d/$(cygpath -u "$PWD") && ./tools/smoke_test_pgs.sh'