name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # Cache only the compile-critical parts of the installed MinGW64
      # toolchain plus CMake/Qt runtime metadata. CMake itself needs
      # share/cmake modules at runtime; Qt CMake targets also reference
      # share/qt6 plugin/metatype files, so cache hits must restore both.
      - name: Cache MinGW64 toolchain
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\mingw64\bin
            C:\msys64\mingw64\lib
            C:\msys64\mingw64\include
            C:\msys64\mingw64\x86_64-w64-mingw32
            C:\msys64\mingw64\share\cmake
            C:\msys64\mingw64\share\qt6
          key: msys2-mingw64-installed-${{ runner.os }}-v5

      - name: Install MinGW64 toolchain
        shell: pwsh
        run: |
          $needsInstall = '${{ steps.mingw-cache.outputs.cache-hit }}' -ne 'true'
          if (-not $needsInstall) {
            & 'C:\msys64\mingw64\bin\cmake.exe' --version
            if ($LASTEXITCODE -ne 0) { $needsInstall = $true }
          }
          if (-not (Test-Path 'C:\msys64\mingw64\share\cmake\Modules\CMake.cmake')) { $needsInstall = $true }
          if (-not (Test-Path 'C:\msys64\mingw64\share\qt6')) { $needsInstall = $true }
          if (-not $needsInstall) {
            'MinGW64 toolchain cache is complete.'
            return
          }
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-httpserver mingw-w64-x86_64-qt6-websockets mingw-w64-x86_64-qt6-tools'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/build_pgs.sh'

      - name: Run core unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/test_core_units.sh'

      - name: Run module manager unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/test_module_manager.sh'

      - name: Run scheduler cron unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/test_sched_cron.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/smoke_test_pgs.sh'

      - name: Build Qt desktop app
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && rm -rf build/pgs_admin_qt && cmake -S qt/pgs_admin_qt -B build/pgs_admin_qt -G "MinGW Makefiles" -DCMAKE_PREFIX_PATH=/mingw64 -DCMAKE_CXX_COMPILER=/mingw64/bin/g++.exe -DCMAKE_BUILD_TYPE=Release && cmake --build build/pgs_admin_qt -j 1'

      - name: Build Qt web consoles
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && mkdir -p build/tmp build/home && export HOME="$PWD/build/home" TMPDIR="$(cygpath -w "$PWD/build/tmp")" && export TEMP="$TMPDIR" TMP="$TMPDIR" && bash ./tools/build_qt_web.sh'
