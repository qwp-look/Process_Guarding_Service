# Continuous integration for ProcessGuard (PGS).
# Builds the C++ core + CLI + examples with MSYS2 MinGW64, then runs the
# console smoke test so a regression in the protocol / persistence / restart
# path is caught before merge. Qt targets are not built here to keep the CI
# matrix lightweight; they share the same headers and the C++ build covers
# compile-time breakage in the shared code.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            make

      - name: Build C++ core, CLI and examples
        run: |
          export PATH=/mingw64/bin:/usr/bin
          hash -r
          tools/build_pgs.sh

      - name: Run smoke test
        run: |
          export PATH=/mingw64/bin:/usr/bin
          hash -r
          tools/smoke_test_pgs.sh