name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # Cache only the compile-critical parts of the installed MinGW64
      # toolchain (bin/lib/include + the mingw target sysroot). We exclude
      # share/ on purpose: it is ~40k doc/man/cmake-help files that the
      # build never reads, and actions/cache restore time scales with file
      # count, so listing them blew the restore from ~15s to ~40s.
      - name: Cache MinGW64 toolchain
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\mingw64\bin
            C:\msys64\mingw64\lib
            C:\msys64\mingw64\include
            C:\msys64\mingw64\x86_64-w64-mingw32
          key: msys2-mingw64-installed-${{ runner.os }}-v2

      - name: Install MinGW64 toolchain
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/build_pgs.sh'

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/run_unit_tests.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/smoke_test_pgs.sh'