name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # Cache the pacman package download cache. The windows-2025 image ships
      # MSYS2 itself at C:\msys64 but NOT the mingw-w64 toolchain (gcc/cmake/
      # make), so the first run downloads ~300MB of packages. By caching
      # C:\msys64\var\cache\pacman\pkg, subsequent runs reuse the downloaded
      # .pkg.tar.zst files and pacman only unpacks them locally -- no network
      # re-download. This cuts the toolchain step from ~80s to ~15s.
      - name: Cache MSYS2 pacman packages
        uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: msys2-mingw64-pkgs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            msys2-mingw64-pkgs-${{ runner.os }}-

      - name: Install MinGW64 toolchain
        shell: pwsh
        run: |
          # MSYS2 is preinstalled at C:\msys64 (pacman 6.1.0) but the mingw-w64
          # gcc/cmake/make packages are not. Install them; with the cache above,
          # pacman reuses cached .pkg files and only fetches what is missing.
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake make'

      - name: Build C++ core, CLI and examples
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          # Use GITHUB_WORKSPACE (always set by the Actions runtime) instead of
          # $PWD, which is empty when pwsh spawns bash and caused
          # "cd /d//home/runneradmin: No such file".
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/build_pgs.sh'

      - name: Run smoke test
        shell: pwsh
        run: |
          $env:Path = 'C:\msys64\mingw64\bin;C:\msys64\usr\bin;' + $env:Path
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE" && ./tools/smoke_test_pgs.sh'